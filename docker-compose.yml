# Local PostgreSQL for development (same schema as Render)
# Usage: docker compose up -d

services:
  db:
    image: postgres:16-alpine
    container_name: companyformautomation-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: companyform
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d companyform"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
